name: Lint and Format Code

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - name: 🛎️ Checkout Code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}  # Allows auto-commit

    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: 💾 Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: 📦 Install Dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pylint black pre-commit

    - name: 🎨 Auto-Format Code with Black
      run: |
        black .
        git diff --exit-code || echo "Code formatted, committing changes."

    - name: 🚀 Auto-Commit Formatted Code
      if: success()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "🔧 Auto-format code with Black" || echo "No changes to commit"
        git push origin ${{ github.ref }} || echo "No changes to push"

    - name: 🔎 Run Pylint
      run: |
        pylint --ignore=venv,migrations $(git ls-files '*.py')
