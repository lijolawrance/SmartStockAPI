name: Lint and Format Code (Warnings Only)

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12.8"]
    steps:
    - name: 🛎️ Checkout Code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}  # Allows auto-commit

    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: 💾 Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: 📦 Install Dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pylint black pre-commit

    - name: 🎨 Auto-Format Code with Black (Warnings Only)
      run: |
        black .
        git diff --exit-code || echo "⚠️ Code formatted, but continuing."

    - name: 🚀 Auto-Commit Formatted Code (No Failure)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "🔧 Auto-format code with Black" || echo "⚠️ No changes to commit, continuing."
        git push origin ${{ github.ref }} || echo "⚠️ No changes to push, continuing."

    - name: 🔎 Run Pylint (Warnings Only)
      continue-on-error: true  # ✅ This prevents the job from failing
      run: |
        pylint --ignore=venv,migrations $(git ls-files '*.py') || echo "⚠️ Pylint warnings detected, but continuing."
